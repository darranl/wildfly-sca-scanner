name: Validate Suppressions

on:
  push:
    paths:
      - 'suppressions/**'
      - 'owasp-suppressions/**'
      - 'suppressions-tool/**'
      - '.github/workflows/validate-suppressions.yaml'
  pull_request:
    paths:
      - 'suppressions/**'
      - 'owasp-suppressions/**'
      - 'suppressions-tool/**'
      - '.github/workflows/validate-suppressions.yaml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'suppressions-tool/pom.xml'

      - name: Build suppressions tool
        run: mvn -f suppressions-tool/pom.xml package -q

      - name: Validate canonical YAML
        run: java -jar suppressions-tool/target/suppressions-tool-1.0.0-SNAPSHOT.jar validate suppressions/suppressions.yaml

      - name: Regenerate Trivy ignore file
        run: java -jar suppressions-tool/target/suppressions-tool-1.0.0-SNAPSHOT.jar convert-trivy suppressions/suppressions.yaml suppressions/.trivyignore-check.yaml

      - name: Check Trivy ignore file is up to date
        run: diff suppressions/.trivyignore.yaml suppressions/.trivyignore-check.yaml

      - name: Regenerate OWASP DC XML
        run: java -jar suppressions-tool/target/suppressions-tool-1.0.0-SNAPSHOT.jar convert-owaspdc suppressions/suppressions.yaml owasp-suppressions/owasp-suppressions-check.xml

      - name: Check OWASP DC roundtrip XML is up to date
        run: diff owasp-suppressions/owasp-suppressions-roundtrip.xml owasp-suppressions/owasp-suppressions-check.xml

      - name: Check original OWASP DC XML matches canonical YAML
        run: java -jar suppressions-tool/target/suppressions-tool-1.0.0-SNAPSHOT.jar check-drift owasp-suppressions/owasp-suppressions.xml suppressions/suppressions.yaml
